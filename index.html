<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#1a1a1a" />
    <meta
      name="description"
      content="AR Drawing & Tracing - Upload an image and trace it using your camera"
    />

    <title>AR Drawing & Tracing</title>

    <link rel="manifest" href="manifest.json" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231a1a1a' width='192' height='192'/><circle cx='96' cy='96' r='60' fill='%23ff6b6b'/></svg>"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231a1a1a' width='192' height='192'/><circle cx='96' cy='96' r='60' fill='%23ff6b6b'/></svg>"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Main Container -->
    <div class="app-container">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <h1 class="app-title">AR Draw</h1>
        </div>
        <div class="top-bar-right">
          <select id="cameraSelect" class="camera-select" title="Select camera">
            <option value="">Loading cameras...</option>
          </select>
          <button
            id="switchCameraBtn"
            class="icon-btn"
            title="Switch camera"
            aria-label="Switch camera"
          >
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14h8V5H8zm6 13h-4v-3h4v3zm0-5h-4V7h4v6z" />
              <path
                d="M15.5 1h-8C6.12 1 5 2.12 5 3.5v17C5 21.88 6.12 23 7.5 23h8c1.38 0 2.5-1.12 2.5-2.5v-17C18 2.12 16.88 1 15.5 1zm-4 21c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-4H7.5V4h8v14z"
              />
            </svg>
          </button>
          <button
            id="fullscreenBtn"
            class="icon-btn"
            title="Fullscreen"
            aria-label="Fullscreen"
          >
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
              />
            </svg>
          </button>
          <button
            id="settingsBtn"
            class="icon-btn"
            title="Settings"
            aria-label="Settings"
          >
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l1.72-1.34c.15-.12.19-.34.1-.51l-1.64-2.84c-.1-.17-.32-.21-.49-.12l-2.03 1.59c-.42-.32-.9-.6-1.44-.78l-.3-2.34c-.04-.2-.23-.34-.43-.34h-3.28c-.2 0-.39.14-.43.34l-.3 2.34c-.54.18-1.02.46-1.44.78l-2.03-1.59c-.16-.13-.38-.09-.49.12L2.7 8.21c-.1.17-.06.39.1.51l1.72 1.34c-.05.3-.07.62-.07.94s.02.64.07.94l-1.72 1.34c-.15.12-.19.34-.1.51l1.64 2.84c.1.17.32.21.49.12l2.03-1.59c.42.32.9.6 1.44.78l.3 2.34c.05.2.23.34.43.34h3.28c.2 0 .39-.14.43-.34l.3-2.34c.54-.18 1.02-.46 1.44-.78l2.03 1.59c.16.13.38.09.49-.12l1.64-2.84c.1-.17.06-.39-.1-.51l-1.72-1.34zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- Camera Container -->
      <div class="camera-container" id="cameraContainer">
        <video id="cameraVideo" playsinline autoplay muted></video>

        <!-- Grid Overlay (hidden by default) -->
        <canvas id="gridCanvas" class="grid-canvas"></canvas>

        <!-- Image Overlay Container -->
        <div class="overlay-container" id="overlayContainer">
          <img
            id="overlayImage"
            class="overlay-image"
            draggable="false"
            alt="Trace image"
          />
        </div>

        <!-- Touch Guides (for pinch-to-zoom/rotate feedback) -->
        <div class="touch-guide" id="touchGuide"></div>
      </div>

      <!-- Bottom Toolbar -->
      <nav class="bottom-toolbar">
        <button id="uploadBtn" class="toolbar-btn" title="Upload image">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
          <span>Upload</span>
        </button>

        <button id="opacityBtn" class="toolbar-btn" title="Opacity">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5z"
            />
          </svg>
          <span>Opacity</span>
        </button>

        <button id="scaleBtn" class="toolbar-btn" title="Scale">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zm-5.04-6.71l-2.75 3.54h2.86v2h-4v-4h2v2.12l2.73-3.54h-2.76V9h4v4h-2v-.71z"
            />
          </svg>
          <span>Scale</span>
        </button>

        <button id="rotateBtn" class="toolbar-btn" title="Rotate">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M15.55 5.55L11 1v3.07C7.06 4.56 4 7.72 4 11.5c0 .33.02.66.07 1h2.02c-.05-.33-.07-.66-.07-1 0-2.64 1.35-4.93 3.39-6.32L11 9h4.55L15.55 5.55zM19.93 11c.05.33.07.66.07 1 0 2.64-1.35 4.93-3.39 6.32L13 15H8.45l1.55 3.45L13 23v-3.07c3.94-.52 7-3.68 7-7.43 0-.33-.02-.66-.07-1h-2.02z"
            />
          </svg>
          <span>Rotate</span>
        </button>

        <button id="lockBtn" class="toolbar-btn" title="Lock position">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18 8h-1V6c0-2.76-2.24-5-5-5s-5 2.24-5 5v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"
            />
          </svg>
          <span>Lock</span>
        </button>

        <button id="hideBtn" class="toolbar-btn" title="Hide/show overlay">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
            />
          </svg>
          <span>Hide</span>
        </button>

        <button id="resetBtn" class="toolbar-btn" title="Reset position">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v4l5-5-5-5v4z"
            />
          </svg>
          <span>Reset</span>
        </button>

        <button id="gridBtn" class="toolbar-btn" title="Grid">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"
            />
          </svg>
          <span>Grid</span>
        </button>

        <button id="moreBtn" class="toolbar-btn" title="More options">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"
            />
          </svg>
          <span>More</span>
        </button>
      </nav>

      <!-- Settings Panel -->
      <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
          <h2>Settings</h2>
          <button class="close-btn" id="closeSettingsBtn">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"
              />
            </svg>
          </button>
        </div>

        <div class="settings-content">
          <!-- Camera Selection -->
          <div class="setting-group">
            <label for="settingsCameraSelect">Camera:</label>
            <select id="settingsCameraSelect" class="settings-select">
              <option value="">Loading...</option>
            </select>
          </div>

          <!-- Zoom Slider -->
          <div class="setting-group" id="zoomGroup" style="display: none">
            <label for="zoomSlider">Zoom: <span id="zoomValue">1x</span></label>
            <input
              type="range"
              id="zoomSlider"
              class="settings-slider"
              min="1"
              max="4"
              step="0.1"
              value="1"
            />
            <small id="zoomInfo">Not supported</small>
          </div>

          <!-- Opacity Slider -->
          <div class="setting-group">
            <label for="settingsOpacitySlider"
              >Opacity: <span id="settingsOpacityValue">100%</span></label
            >
            <input
              type="range"
              id="settingsOpacitySlider"
              class="settings-slider"
              min="0"
              max="100"
              value="100"
            />
          </div>

          <!-- Scale Slider -->
          <div class="setting-group">
            <label for="settingsScaleSlider"
              >Scale: <span id="settingsScaleValue">100%</span></label
            >
            <input
              type="range"
              id="settingsScaleSlider"
              class="settings-slider"
              min="10"
              max="400"
              value="100"
            />
          </div>

          <!-- Rotation Slider -->
          <div class="setting-group">
            <label for="settingsRotateSlider"
              >Rotate: <span id="settingsRotateValue">0°</span></label
            >
            <input
              type="range"
              id="settingsRotateSlider"
              class="settings-slider"
              min="0"
              max="360"
              value="0"
            />
          </div>

          <!-- Brightness Slider -->
          <div class="setting-group">
            <label for="brightnessSlider"
              >Brightness: <span id="brightnessValue">100%</span></label
            >
            <input
              type="range"
              id="brightnessSlider"
              class="settings-slider"
              min="50"
              max="150"
              value="100"
            />
          </div>

          <!-- Contrast Slider -->
          <div class="setting-group">
            <label for="contrastSlider"
              >Contrast: <span id="contrastValue">100%</span></label
            >
            <input
              type="range"
              id="contrastSlider"
              class="settings-slider"
              min="50"
              max="150"
              value="100"
            />
          </div>

          <!-- Flip Options -->
          <div class="setting-group checkbox-group">
            <label>
              <input type="checkbox" id="mirrorXCheckbox" />
              <span>Flip Horizontally</span>
            </label>
          </div>

          <div class="setting-group checkbox-group">
            <label>
              <input type="checkbox" id="mirrorYCheckbox" />
              <span>Flip Vertically</span>
            </label>
          </div>

          <!-- Invert Colors -->
          <div class="setting-group checkbox-group">
            <label>
              <input type="checkbox" id="invertCheckbox" />
              <span>Invert Colors</span>
            </label>
          </div>

          <!-- Paper Mode -->
          <div class="setting-group checkbox-group">
            <label>
              <input type="checkbox" id="paperModeCheckbox" />
              <span>Paper Mode (High Contrast)</span>
            </label>
          </div>

          <!-- Debug Panel -->
          <div class="setting-group">
            <details>
              <summary>Debug Info</summary>
              <div class="debug-panel">
                <p><strong>Camera:</strong> <span id="debugCamera">-</span></p>
                <p>
                  <strong>Zoom Support:</strong>
                  <span id="debugZoomSupport">-</span>
                </p>
                <p>
                  <strong>Current Zoom:</strong>
                  <span id="debugZoomValue">-</span>
                </p>
                <p>
                  <strong>Resolution:</strong>
                  <span id="debugResolution">-</span>
                </p>
                <p>
                  <strong>Errors:</strong> <span id="debugErrors">None</span>
                </p>
              </div>
            </details>
          </div>

          <!-- Action Buttons -->
          <div class="setting-group button-group">
            <button id="saveDefaultsBtn" class="action-btn primary-btn">
              Save Defaults
            </button>
            <button id="resetAllBtn" class="action-btn secondary-btn">
              Reset All
            </button>
          </div>
        </div>
      </div>

      <!-- Hidden file input -->
      <input
        type="file"
        id="fileInput"
        accept="image/*"
        style="display: none"
      />

      <!-- Toast messages -->
      <div id="toastContainer" class="toast-container"></div>
    </div>

    <!-- Manifest for PWA -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    </script>

    <script src="script.js"></script>
  </body>
</html>
